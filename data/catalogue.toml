# The texts of PollisKnowledge.jl: one entry each, in the order Pollis lists them. Each text is an artifact of its own,
# named by its id, downloaded the first time it is asked for: the text's files, `contents.toml`, its documents in
# their order (file, title and kind, "pdf" or "markdown"), and `LICENCE.md`, its authors, source and licence. An id is
# a name SQL takes as it is: lower-case letters, digits and underscores.
#
# `type` is what the text is: Book, Lecture Notes, Report, Manual, Article. `format` is that of its files, "pdf" or
# "markdown". `page` is the text's page on its authors' site. `download` is where its file is fetched from, at the
# revision of `revision`. `size_mb` is the size of its artifact as downloaded, in MB. `changes` says what the artifact
# leaves out of the text, or changes in it, when it is not the file of its authors unchanged.
#
# `reference` is the key of the text's work in PollisReferences.jl, the library of references of Pollis, which has its
# authors, year, abstract, key words and classifications.
#
# A published book has its cover, `cover`, a file of data/covers, as its authors show it on its page, at `cover_from`,
# and `hard_copy`, the page of its publisher where the printed book is sold.

